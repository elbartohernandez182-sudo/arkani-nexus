<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARKANI NEXUS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            background: #0d1117;
            border-bottom: 1px solid #00ffff33;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.2em;
            letter-spacing: 4px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* LAYOUT PRINCIPAL */
        .main {
            display: grid;
            grid-template-columns: 220px 1fr 200px;
            height: calc(100vh - 50px);
        }

        /* PANEL IZQUIERDO - AVATAR */
        .panel-left {
            background: #0d1117;
            border-right: 1px solid #00ffff22;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        /* AVATAR SVG */
        #avatar-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 15px;
        }
        .avatar-ring {
            animation: rotate 8s linear infinite;
            transform-origin: center;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .avatar-core {
            transition: all 0.3s;
        }
        .speaking .avatar-core {
            filter: drop-shadow(0 0 20px #00ffff);
        }

        .arkani-name {
            font-size: 1em;
            letter-spacing: 3px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 5px;
        }
        .arkani-status {
            font-size: 0.7em;
            color: #00ffff88;
            margin-bottom: 20px;
        }

        /* STATS */
        .stats {
            width: 100%;
            font-size: 0.7em;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            border-bottom: 1px solid #00ffff11;
        }
        .stat-label { color: #00ffff66; }
        .stat-value { color: #00ffff; }

        /* CENTRO - CHAT */
        .chat-area {
            display: flex;
            flex-direction: column;
            background: #080810;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: #0a0a0f; }
        .messages::-webkit-scrollbar-thumb { background: #00ffff33; }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9em;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-user {
            align-self: flex-end;
            background: #00ffff15;
            border: 1px solid #00ffff33;
            color: #ffffff;
        }
        .msg-arkani {
            align-self: flex-start;
            background: #0d1117;
            border: 1px solid #00ffff22;
            color: #00ffff;
        }
        .msg-time {
            font-size: 0.65em;
            color: #00ffff44;
            margin-top: 4px;
        }
        .msg-label {
            font-size: 0.7em;
            color: #00ffff88;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }

        /* TYPING */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 10px 14px;
            background: #0d1117;
            border: 1px solid #00ffff22;
            border-radius: 8px;
            color: #00ffff88;
            font-size: 0.85em;
        }
        .typing-indicator.visible { display: block; }
        .dot { animation: blink 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        /* INPUT */
        .input-area {
            padding: 15px;
            background: #0d1117;
            border-top: 1px solid #00ffff22;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #input-text {
            flex: 1;
            background: #0a0a0f;
            border: 1px solid #00ffff33;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            outline: none;
            transition: border-color 0.3s;
        }
        #input-text:focus { border-color: #00ffff; }
        #input-text::placeholder { color: #00ffff44; }

        .btn {
            background: #00ffff15;
            border: 1px solid #00ffff44;
            color: #00ffff;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #00ffff25;
            border-color: #00ffff;
            box-shadow: 0 0 8px #00ffff44;
        }

        /* PANEL DERECHO - MONITOR */
        .panel-right {
            background: #0d1117;
            border-left: 1px solid #00ffff22;
            padding: 15px 12px;
            font-size: 0.72em;
            overflow-y: auto;
        }
        .monitor-title {
            color: #00ffff88;
            letter-spacing: 2px;
            font-size: 0.8em;
            margin-bottom: 10px;
            border-bottom: 1px solid #00ffff22;
            padding-bottom: 5px;
        }
        .monitor-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #00ffff11;
        }
        .monitor-label { color: #00ffff66; }
        .monitor-value { color: #00ff88; }

        .bar-container {
            background: #00ffff11;
            border-radius: 3px;
            height: 6px;
            margin: 3px 0 8px 0;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: #00ffff;
            border-radius: 3px;
            transition: width 1s ease;
            box-shadow: 0 0 6px #00ffff;
        }

        .section-divider {
            color: #00ffff33;
            font-size: 0.7em;
            letter-spacing: 2px;
            margin: 12px 0 6px 0;
        }

        /* TAREAS */
        .task-item {
            padding: 5px 0;
            border-bottom: 1px solid #00ffff11;
            color: #00ffff88;
            font-size: 0.85em;
        }
        .task-add {
            width: 100%;
            background: #00ffff08;
            border: 1px solid #00ffff22;
            color: #00ffff;
            padding: 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            margin-top: 8px;
            outline: none;
        }
        .task-add::placeholder { color: #00ffff33; }

        /* WELCOME */
        .welcome-msg {
            text-align: center;
            color: #00ffff44;
            font-size: 0.85em;
            padding: 20px;
            margin: auto;
        }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div>
        <span class="status-dot"></span>
        <h1>ARKANI NEXUS</h1>
    </div>
    <div style="font-size:0.7em; color:#00ffff66; letter-spacing:2px">
        SISTEMA ACTIVO · <span id="clock">--:--:--</span>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- PANEL IZQUIERDO -->
    <div class="panel-left">

        <!-- AVATAR -->
        <div id="avatar-container">
            <svg viewBox="0 0 160 160" width="160" height="160">
                <!-- Anillos externos -->
                <g class="avatar-ring">
                    <circle cx="80" cy="80" r="70"
                            fill="none" stroke="#00ffff" stroke-width="0.5"
                            stroke-dasharray="8 4" opacity="0.3"/>
                </g>
                <!-- Anillo medio -->
                <circle cx="80" cy="80" r="55"
                        fill="none" stroke="#00ffff" stroke-width="0.8"
                        opacity="0.4"/>
                <!-- Cuerpo holografico -->
                <ellipse cx="80" cy="95" rx="28" ry="38"
                         fill="rgba(0,255,255,0.05)"
                         stroke="#00ffff" stroke-width="1"
                         class="avatar-core"/>
                <!-- Cabeza -->
                <circle cx="80" cy="52" r="22"
                        fill="rgba(0,255,255,0.08)"
                        stroke="#00ffff" stroke-width="1.5"
                        class="avatar-core"/>
                <!-- Ojos -->
                <ellipse cx="73" cy="50" rx="4" ry="5"
                         fill="#00ffff" opacity="0.8"/>
                <ellipse cx="87" cy="50" rx="4" ry="5"
                         fill="#00ffff" opacity="0.8"/>
                <!-- Brillo ojos -->
                <circle cx="74" cy="48" r="1.5" fill="white" opacity="0.9"/>
                <circle cx="88" cy="48" r="1.5" fill="white" opacity="0.9"/>
                <!-- Lineas de datos -->
                <line x1="30" y1="80" x2="55" y2="80"
                      stroke="#00ffff" stroke-width="0.5" opacity="0.4"/>
                <line x1="105" y1="80" x2="130" y2="80"
                      stroke="#00ffff" stroke-width="0.5" opacity="0.4"/>
                <line x1="80" y1="140" x2="80" y2="155"
                      stroke="#00ffff" stroke-width="0.5" opacity="0.4"/>
                <!-- Particulas -->
                <circle cx="35" cy="60" r="2" fill="#00ffff" opacity="0.5">
                    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="125" cy="100" r="2" fill="#00ffff" opacity="0.5">
                    <animate attributeName="opacity" values="0;0.5;0" dur="2.5s" repeatCount="indefinite"/>
                </circle>
                <circle cx="50" cy="120" r="1.5" fill="#00ffff" opacity="0.3">
                    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
                </circle>
            </svg>
        </div>

        <div class="arkani-name">ARKANI</div>
        <div class="arkani-status" id="arkani-status">EN LINEA</div>

        <!-- STATS -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Conversaciones</span>
                <span class="stat-value" id="stat-conv">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Pendientes</span>
                <span class="stat-value" id="stat-pend">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Aprendizajes</span>
                <span class="stat-value" id="stat-apr">-</span>
            </div>
        </div>
    </div>

    <!-- CHAT CENTRAL -->
    <div class="chat-area">
        <div class="messages" id="messages">
            <div class="welcome-msg">
                <div style="font-size:1.5em; margin-bottom:10px">◈</div>
                <div style="color:#00ffff; margin-bottom:5px; letter-spacing:2px">ARKANI NEXUS</div>
                <div>Sistema listo. Escribe un mensaje.</div>
            </div>
        </div>

        <div class="typing-indicator" id="typing">
            Arkani pensando
            <span class="dot">.</span>
            <span class="dot">.</span>
            <span class="dot">.</span>
        </div>

        <div class="input-area">
            <input type="text" id="input-text"
                   placeholder="Escribe un mensaje a Arkani..."
                   autocomplete="off"/>
            <button class="btn" onclick="enviar()">ENVIAR</button>
        </div>
    </div>

    <!-- PANEL DERECHO -->
    <div class="panel-right">
        <div class="monitor-title">◈ MONITOR</div>

        <div class="monitor-item">
            <span class="monitor-label">CPU</span>
            <span class="monitor-value" id="mon-cpu">-%</span>
        </div>
        <div class="bar-container">
            <div class="bar-fill" id="bar-cpu" style="width:0%"></div>
        </div>

        <div class="monitor-item">
            <span class="monitor-label">RAM</span>
            <span class="monitor-value" id="mon-ram">-%</span>
        </div>
        <div class="bar-container">
            <div class="bar-fill" id="bar-ram" style="width:0%"></div>
        </div>

        <div class="section-divider">── TAREAS ──</div>

        <div id="tareas-lista">
            <div class="task-item">Cargando...</div>
        </div>

        <input type="text" class="task-add" id="nueva-tarea"
               placeholder="+ Nueva tarea..."
               onkeypress="if(event.key==='Enter') agregarTarea()"/>

        <div class="section-divider">── NEXUS ──</div>

        <div class="monitor-item">
            <span class="monitor-label">Modelo</span>
            <span class="monitor-value">qwen2.5:7b</span>
        </div>
        <div class="monitor-item">
            <span class="monitor-label">Version</span>
            <span class="monitor-value">v2.0</span>
        </div>
        <div class="monitor-item">
            <span class="monitor-label">Puerto</span>
            <span class="monitor-value">8080</span>
        </div>
    </div>

</div>

<script>
const socket = io();
const messages = document.getElementById('messages');
const inputText = document.getElementById('input-text');

// Conexion
socket.on('connect', () => {
    console.log('Conectado a Arkani');
    actualizarStatus();
    cargarTareas();
});

socket.on('respuesta', (data) => {
    document.getElementById('typing').classList.remove('visible');
    agregarMensaje('ARKANI', data.texto, data.timestamp, 'msg-arkani');
    // Animar avatar
    document.getElementById('avatar-container').classList.remove('speaking');
});

socket.on('typing', (data) => {
    const t = document.getElementById('typing');
    if (data.status) {
        t.classList.add('visible');
        document.getElementById('avatar-container').classList.add('speaking');
    } else {
        t.classList.remove('visible');
    }
    messages.scrollTop = messages.scrollHeight;
});

// Enviar mensaje
function enviar() {
    const texto = inputText.value.trim();
    if (!texto) return;

    // Limpiar bienvenida
    const welcome = messages.querySelector('.welcome-msg');
    if (welcome) welcome.remove();

    agregarMensaje('TU', texto, horaActual(), 'msg-user');
    socket.emit('mensaje', {texto: texto});
    inputText.value = '';
    messages.scrollTop = messages.scrollHeight;
}

function agregarMensaje(autor, texto, hora, clase) {
    const div = document.createElement('div');
    div.className = `msg ${clase}`;
    div.innerHTML = `
        <div class="msg-label">${autor}</div>
        <div>${texto}</div>
        <div class="msg-time">${hora}</div>
    `;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

// Enter para enviar
inputText.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') enviar();
});

// Reloj
function horaActual() {
    return new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
function actualizarReloj() {
    document.getElementById('clock').textContent = horaActual();
}
setInterval(actualizarReloj, 1000);
actualizarReloj();

// Status del sistema
function actualizarStatus() {
    fetch('/status')
        .then(r => r.json())
        .then(data => {
            document.getElementById('mon-cpu').textContent = data.cpu + '%';
            document.getElementById('bar-cpu').style.width = data.cpu + '%';
            document.getElementById('mon-ram').textContent = data.ram + '%';
            document.getElementById('bar-ram').style.width = data.ram + '%';
            document.getElementById('stat-conv').textContent = data.conversaciones;
            document.getElementById('stat-pend').textContent = data.pendientes;
            document.getElementById('stat-apr').textContent = data.aprendizajes;

            const status = document.getElementById('arkani-status');
            status.textContent = data.arkani_ok ? 'EN LINEA' : 'MODO BASICO';
        })
        .catch(e => console.log('Error status:', e));
}
setInterval(actualizarStatus, 5000);

// Tareas
function cargarTareas() {
    fetch('/tasks')
        .then(r => r.json())
        .then(data => {
            const lista = document.getElementById('tareas-lista');
            const tareas = data.tareas || [];
            if (tareas.length === 0) {
                lista.innerHTML = '<div class="task-item" style="color:#00ffff33">Sin tareas</div>';
                return;
            }
            lista.innerHTML = tareas.slice(-5).map(t => `
                <div class="task-item">
                    ${t.estado === 'completada' ? '✅' : '⏳'} ${t.objetivo.substring(0, 30)}...
                </div>
            `).join('');
        })
        .catch(e => console.log('Error tareas:', e));
}

function agregarTarea() {
    const input = document.getElementById('nueva-tarea');
    const texto = input.value.trim();
    if (!texto) return;

    fetch('/tasks', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({objetivo: texto, prioridad: 'normal'})
    })
    .then(r => r.json())
    .then(data => {
        input.value = '';
        cargarTareas();
    });
}
</script>
</body>
</html>
